<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16070d">
<title>Только для тебя ♡</title>
<style>
:root{--bg:#10070b;--panel:#1b0a12;--wine:#65152b;--red:#d94c70;--pink:#ffc1d0;--cream:#fff0f2;--muted:#c9a8b2}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--cream);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at 50% 0%,#421323 0%,#1a0911 45%,#0b0609 100%);overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.heart{position:absolute;bottom:-40px;color:#e94d76;opacity:0;animation:floatUp linear forwards;text-shadow:0 0 16px #a5234b88}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}12%{opacity:.6}85%{opacity:.45}100%{transform:translateY(-115vh) rotate(35deg) scale(1.25);opacity:0}}
main{position:relative;z-index:1;width:min(100% - 28px,680px);margin:0 auto;padding:28px 0 42px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;color:var(--muted);font:11px/1.4 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.music{border:1px solid #854057;background:#210c16;color:#ffd8e1;border-radius:999px;padding:9px 12px;font:12px Arial,sans-serif}
.card{border:1px solid #79334a88;background:linear-gradient(145deg,#240d17ed,#140910f5);box-shadow:0 20px 80px #0008, inset 0 1px #ffffff08;border-radius:24px;padding:clamp(22px,6vw,44px);text-align:center;backdrop-filter:blur(8px)}
.eyebrow{color:#e58aa2;text-transform:uppercase;letter-spacing:.22em;font:10px Arial,sans-serif;margin-bottom:17px}
h1,h2{font-weight:normal;line-height:1.12;margin:0 0 18px}
h1{font-size:clamp(32px,8vw,54px);color:#fff0f3}
h2{font-size:clamp(27px,6vw,39px)}
p{font-size:clamp(15px,3.8vw,18px);line-height:1.75;color:#e7cbd3;margin:0 auto 22px;max-width:510px}
.rose{font-size:45px;line-height:1;margin:8px 0 22px;filter:drop-shadow(0 0 20px #b82d54)}
.btn{border:1px solid #d55a7c;background:linear-gradient(135deg,#8b1e3e,#571127);color:#fff5f7;padding:13px 21px;border-radius:999px;box-shadow:0 7px 22px #0004;transition:transform .2s,filter .2s;min-height:46px}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.secondary{background:#210d16;border-color:#754052;color:#f4cbd5}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.progress{display:flex;justify-content:center;gap:7px;margin:0 0 22px}
.dot{height:4px;width:24px;border-radius:9px;background:#542236;transition:background .3s}
.dot.active{background:#e5688a;box-shadow:0 0 10px #e5688a66}
.field{display:block;width:100%;max-width:270px;margin:10px auto 8px;padding:13px 15px;border:1px solid #824057;border-radius:12px;background:#10070c;color:#fff;text-align:center;outline:none}
.field:focus{border-color:#ee8ba5;box-shadow:0 0 0 3px #d94c7022}
.hint{font:12px/1.6 Arial,sans-serif;color:#b9919e;margin-top:10px}
.choice{display:block;width:100%;max-width:420px;margin:9px auto;background:#210d16;border:1px solid #6d3448;border-radius:13px;padding:13px 15px;color:#f7dce3;text-align:left}
.choice:hover,.choice:focus{border-color:#e87596;background:#341020}
.feedback{min-height:24px;color:#f29bb3;font-size:14px;margin-top:12px}
.envelope-wrap{perspective:800px;margin:18px auto 10px;width:min(100%,300px)}
.envelope{position:relative;width:100%;height:180px;background:#6c1c35;border:1px solid #c46a82;border-radius:7px;box-shadow:0 12px 30px #0006;cursor:pointer;overflow:hidden}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,transparent 49.5%,#a94460 50%,#8d2947 51%,transparent 51.5%),linear-gradient(220deg,transparent 49.5%,#8d2947 50%,#a94460 51%,transparent 51.5%);opacity:.9}
.flap{position:absolute;top:0;left:0;width:100%;height:100%;background:#a43b58;clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:top;transition:transform .7s;z-index:2}
.seal{position:absolute;z-index:3;top:57px;left:calc(50% - 24px);width:48px;height:48px;border-radius:50%;background:#d86b87;border:2px solid #f0a3b6;display:grid;place-items:center;font-size:23px;box-shadow:0 3px 12px #330817}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .seal{opacity:0;transition:opacity .2s}
.letter{display:none;text-align:left;background:#f8e6e8;color:#512035;border-radius:10px;padding:22px;margin:18px auto 0;max-width:480px;white-space:pre-wrap;line-height:1.8;font-size:16px;box-shadow:0 8px 25px #0005}
.letter.show{display:block;animation:appear .7s ease both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cake{font-size:76px;filter:drop-shadow(0 0 18px #d94c7066);margin:5px 0 15px}
.candle{font-size:20px;color:#ffb7c9;letter-spacing:8px;margin-bottom:8px}
.finalnote{border-top:1px solid #673044;padding-top:18px;margin-top:20px;color:#f2c2ce;font-style:italic}
footer{text-align:center;color:#815a68;font:11px Arial,sans-serif;margin-top:18px;letter-spacing:.08em}
@media(max-width:400px){main{width:min(100% - 20px,680px);padding-top:18px}.card{border-radius:19px;padding:23px 18px}.topline{font-size:9px}.btn{padding:12px 16px}}

/* Плавное появление текста и переход между этапами */
#app { transition: opacity .35s ease, transform .35s ease; }
#app.is-leaving { opacity: 0; transform: translateY(12px); }
.reveal { opacity: 0; transform: translateY(14px); animation: revealUp .85s cubic-bezier(.2,.7,.2,1) forwards; }
.reveal.d1 { animation-delay: .12s; }
.reveal.d2 { animation-delay: .28s; }
.reveal.d3 { animation-delay: .44s; }
@keyframes revealUp { to { opacity: 1; transform: translateY(0); } }
.place-choice {
  display:block; width:100%; max-width:440px; margin:10px auto;
  padding:15px 16px; text-align:left; line-height:1.5;
  border:1px solid #754052; border-radius:14px;
  color:#f7dce3; background:#210d16;
  transition:background .2s,border-color .2s,transform .2s;
}
.place-choice:hover,.place-choice:focus { border-color:#e87596; background:#341020; transform:translateY(-1px); }
.place-choice.selected { border-color:#f08ba7; background:#451326; box-shadow:0 0 0 2px #d94c7022, 0 8px 22px #0003; }
.place-choice .place-title { display:block; color:#fff0f3; margin-bottom:3px; }
.place-choice .place-sub { display:block; font-size:13px; color:#c9a8b2; }
.interlude { min-height:150px; display:flex; flex-direction:column; justify-content:center; }

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<main>
  <div class="topline"><span>маленькая история о нас</span><button class="music" id="musicBtn" type="button">♫ Включить музыку</button></div>
  <div class="progress" id="progress" aria-label="Прогресс"></div>
  <section class="card" id="app" aria-live="polite"></section>
  <footer>сделано с любовью · только для тебя ♡</footer>
</main>
<script>
/* НАСТРОЙКИ: поменяй письмо и вопрос в этом блоке */
const CONFIG = {
  date: "11.09.2026",
  nickname: "любимая",
  question: "Что я хочу подарить тебе этим маленьким сайтом?",
  answers: [
    "Ещё одну причину улыбнуться",
    "Ключи от квартиры на берегу моря",
    "Бесконечный запас граната(заманчиво, да?)"
  ],
  correctAnswer: 0,
  letter: `Моя любимая,

Эта идея сначала показалась немного безумной, но на деле оказалась довольно легкой и..мне она безумно нравится, надеюсь, тебе тоже. Я не скажу чего-то нового сейчас и честно говоря даже не знаю что, но..я люблю тебя - это то, что я знаю и не хочу чтобы ты когда-то в этом сомневалась. Было бы символично сделать это на какую-то круглую дату, но я ужасно нетерпеливая и ничего не могу с этим сделать, так что тебе нужно просто с этим смириться) Не могу перестать думать о тебе никогда. Надеюсь, это утро станет чуточку лучше и это поднимет тебе настроение)
Я выбрала тебя, просто помни это. ♡`,
  finalMessage: "Спасибо, что ты есть в моей жизни ♡"
};

const app = document.getElementById('app');
const progress = document.getElementById('progress');
let stage = 0, audioCtx = null, musicOn = false, musicTimer = null, noteIndex = 0;
const totalStages = 8;
const titles = ["начало","память","вопрос","секрет","уют","пауза","письмо","праздник"];
let chosenPlace = "";
let interludeTimer = null;
function updateProgress(){progress.innerHTML=titles.map((_,i)=>`<span class="dot ${i===stage?'active':i<stage?'active':''}"></span>`).join('');}
function go(n){
  stage = n;
  updateProgress();
  app.classList.add('is-leaving');
  setTimeout(() => {
    render();
    app.classList.remove('is-leaving');
    app.querySelectorAll('h1,h2,p,.eyebrow,.rose,.envelope-wrap,.hint,.letter,.btn,.choice,.place-choice,.candle,.cake,.finalnote,input,.feedback')
      .forEach((el,i) => {
        el.classList.add('reveal');
        if(i===1) el.classList.add('d1');
        if(i===2) el.classList.add('d2');
        if(i>=3) el.classList.add('d3');
      });
  }, 280);
}
function next(n=stage+1){go(Math.min(n,totalStages-1));}
function render(){
  if(stage===0){app.innerHTML=`<div class="eyebrow">у тебя одно важное сообщение</div><div class="rose">♥</div><h1>Для тебя<br>кое-что есть…</h1><p>Я приготовила маленький сюрприз.</p><button class="btn" onclick="next()">Открыть мой сюрприз ↗</button>`}
  if(stage===1){app.innerHTML=`<div class="eyebrow">этап 1 · наша история</div><h2>Один особенный день</h2><p>У каждой истории есть начало. Введи дату, с которой мы официально стали <i>нами</i>.</p><input class="field" id="dateInput" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" maxlength="10" aria-label="Дата начала отношений"><div class="feedback" id="dateFeedback"></div><button class="btn" onclick="checkDate()">Это наша дата ♡</button>`}
  if(stage===2){app.innerHTML=`<div class="eyebrow">этап 2 · маленький вопрос</div><h2>${CONFIG.question}</h2><p>Выбирай сердцем. Хотя правильный ответ, кажется, довольно очевидный.</p><div id="choices"></div><div class="feedback" id="answerFeedback"></div>`;const c=document.getElementById('choices');CONFIG.answers.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.textContent='♡  '+a;b.onclick=()=>checkAnswer(i);c.appendChild(b);});}
  if(stage===3){app.innerHTML=`<div class="eyebrow">этап 3 · почти у цели</div><div class="rose">✧ ♥ ✧</div><h2>Осталось открыть секрет</h2><p>Там внутри кое-что, что нельзя купить за деньги. Хотя тортик в конце тоже неплох.</p><p style="font-size:13px;color:#b9919e">Подсказка: иногда самое важное прячется в простом конверте.</p><button class="btn" onclick="next()">Продолжить</button>`}
  if(stage===4){
    app.innerHTML=`<div class="eyebrow reveal">этап 4 · место, где спокойно</div>
      <h2 class="reveal d1">Представь, что ты находишься в безопасном месте…</h2>
      <p class="reveal d2">Например, там, где можно выдохнуть, расслабиться и никуда не спешить.</p>
      <div id="places" class="reveal d3">
        <button class="place-choice" onclick="choosePlace(0,this)">
          <span class="place-title">🌊 На берегу моря вечером</span>
          <span class="place-sub">Шум волн, прохладный воздух и закат над водой.</span>
        </button>
        <button class="place-choice" onclick="choosePlace(1,this)">
          <span class="place-title">🕯️ На мягких подушках рано утром</span>
          <span class="place-sub">Тепло, тишина и ещё целый мирный день впереди.</span>
        </button>
        <button class="place-choice" onclick="choosePlace(2,this)">
          <span class="place-title">♥ В моих объятиях — неважно где</span>
          <span class="place-sub">Главное — чувствовать себя рядом со мной спокойно.</span>
        </button>
      </div>
      <div class="feedback" id="placeFeedback"></div>`;
  }
  if(stage===5){
    app.innerHTML=`<div class="interlude">
      <div class="rose reveal">♡</div>
      <div class="eyebrow reveal d1">хорошо</div>
      <h2 class="reveal d2">Хорошо, а теперь…</h2>
      <p class="reveal d3">Просто нажми дальше.</p>
      <div class="reveal d3"><button class="btn" onclick="next()">Я готова ♡</button></div>
    </div>`;
  }
  if(stage===6){app.innerHTML=`<div class="eyebrow">этап 6 · личное письмо</div><h2>Это для тебя</h2><p>Я выбирала слова, но в итоге решила оставить здесь самое настоящее — то, что хочу сказать именно сейчас.</p><div class="envelope-wrap"><div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Открыть конверт" onclick="openLetter()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLetter()}"><div class="flap"></div><div class="seal">♥</div></div></div><div class="hint" id="envelopeHint">Нажми на конверт, чтобы открыть</div><div class="letter" id="letter"></div><div class="btnrow" id="letterNext" style="display:none"><button class="btn" onclick="next()">Дальше, моя радость →</button></div>`}
  if(stage===7){app.innerHTML=`<div class="eyebrow">этап 7 · наш маленький праздник</div><div class="candle">♧　♧　♧</div><div class="cake">🎂</div><h2>С нашей датой, ${escapeHtml(CONFIG.nickname)}!</h2><p>Пусть у нашей истории будет ещё много глав — смешных, нежных, странных и только наших.</p><button class="btn" onclick="celebrate()">Задуть свечи ✨</button><div id="celebration"></div><div class="finalnote">${CONFIG.finalMessage}</div><div class="btnrow"><button class="btn secondary" onclick="go(0)">Пройти ещё раз ↻</button></div>`}
}
function checkDate(){const input=document.getElementById('dateInput');const feedback=document.getElementById('dateFeedback');const value=input.value.trim().replaceAll('/','.').replaceAll('-','.');if(value===CONFIG.date){feedback.textContent='Да… именно этот день. Я его тоже помню. ♥';setTimeout(()=>next(),900)}else{feedback.textContent='М-м, попробуй ещё раз. Подсказка: 11.09.2026, не забывай больше, солнце';input.focus();}}
function checkAnswer(i){const f=document.getElementById('answerFeedback');if(i===CONFIG.correctAnswer){f.textContent='Именно. А теперь — следующий секрет. ♥';setTimeout(()=>next(),850)}else{f.textContent='Не-а. Попробуй ещё раз, милая ♡';}}
function choosePlace(index, button){
  chosenPlace = ["На берегу моря вечером","На мягких подушках рано утром","В моих объятиях — неважно где"][index];
  document.querySelectorAll('.place-choice').forEach(el=>el.classList.remove('selected'));
  button.classList.add('selected');
  const feedback = document.getElementById('placeFeedback');
  feedback.textContent = "Хорошо. Представь, что ты уже там… ♡";
  if(interludeTimer) clearTimeout(interludeTimer);
  interludeTimer = setTimeout(()=>next(), 1200);
}
function openLetter(){const env=document.getElementById('envelope');if(env.classList.contains('open'))return;env.classList.add('open');document.getElementById('envelopeHint').textContent='Для тебя — от всего сердца';const letter=document.getElementById('letter');letter.textContent=CONFIG.letter;letter.classList.add('show');document.getElementById('letterNext').style.display='flex';burstHearts(18);}
function celebrate(){const box=document.getElementById('celebration');box.innerHTML='<p style="color:#ffb6c9;margin-top:18px">Пусть все наши желания однажды станут общими. ♥</p>';burstHearts(35);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function burstHearts(count){const layer=document.getElementById('hearts');for(let i=0;i<count;i++){setTimeout(()=>makeHeart(true),i*45)}}
function makeHeart(burst=false){const layer=document.getElementById('hearts');const el=document.createElement('span');el.className='heart';el.textContent=['♥','♡','❤','✧'][Math.floor(Math.random()*4)];el.style.left=(burst?25+Math.random()*50:Math.random()*100)+'%';el.style.fontSize=(12+Math.random()*20)+'px';el.style.animationDuration=(burst?2.5:7+Math.random()*8)+'s';if(burst){el.style.bottom=(10+Math.random()*40)+'%';el.style.animationName='floatUp';}layer.appendChild(el);setTimeout(()=>el.remove(),16000)}
setInterval(()=>makeHeart(),850);
function toggleMusic(){const btn=document.getElementById('musicBtn');if(musicOn){musicOn=false;if(musicTimer)clearInterval(musicTimer);btn.textContent='♫ Включить музыку';return;}try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();musicOn=true;btn.textContent='♫ Выключить музыку';playMelody();musicTimer=setInterval(playMelody,4400)}catch(e){btn.textContent='Музыка недоступна';}}
function playMelody(){if(!musicOn||!audioCtx)return;const notes=[261.63,329.63,392,329.63,293.66,349.23,440,392];notes.forEach((freq,i)=>{const start=audioCtx.currentTime+i*.38;const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.045,start+.06);gain.gain.exponentialRampToValueAtTime(.0001,start+.32);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(start);osc.stop(start+.34);});}
document.getElementById('musicBtn').addEventListener('click',toggleMusic);
updateProgress();render();
app.querySelectorAll('h1,h2,p,.eyebrow,.rose,.btn').forEach((el,i)=>{
  el.classList.add('reveal');
  if(i===1) el.classList.add('d1');
  if(i===2) el.classList.add('d2');
  if(i>=3) el.classList.add('d3');
});
</script>
</body>
</html>
